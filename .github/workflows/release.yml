name: Release Builds

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows-cuda
            wheel_backend: cu124
            builder_args: --win nsis
          - os: windows-latest
            artifact: windows-vulkan
            wheel_backend: vulkan
            builder_args: --win nsis
          - os: macos-latest
            artifact: macos-metal
            wheel_backend: metal
            builder_args: --mac dmg zip
          - os: ubuntu-latest
            artifact: linux-cuda
            wheel_backend: cu124
            builder_args: --linux AppImage
          - os: ubuntu-latest
            artifact: linux-vulkan
            wheel_backend: vulkan
            builder_args: --linux AppImage

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Python dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.wheel_backend }}" = "metal" ]; then
            # The upstream 0.3.36 Metal wheel has invalid ZIP CRCs.
            CMAKE_ARGS="-DGGML_METAL=ON -DGGML_NATIVE=OFF" \
              pip install --no-cache-dir --retries 5 --no-binary=llama-cpp-python \
              -r backend/requirements.txt
          else
            wheel_backend="${{ matrix.wheel_backend }}"
            pip install --no-cache-dir --retries 5 --only-binary=llama-cpp-python \
              --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/$wheel_backend \
              -r backend/requirements.txt
          fi
          pip install --no-cache-dir --retries 5 pyinstaller

      - name: Bundle CUDA runtime libraries
        if: matrix.wheel_backend == 'cu124'
        shell: bash
        run: |
          pip install --no-cache-dir --retries 5 -r backend/requirements-cuda.txt
          python scripts/prepare-cuda-runtime.py

      - name: Install Node dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Build frontend
        run: npm run frontend:build

      - name: Build backend
        run: npm run backend:build

      - name: Build Electron app
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          RELEASE_VERSION: 0.1.${{ github.run_number }}
        run: |
          npx electron-builder ${{ matrix.builder_args }} --publish never \
            --config.extraMetadata.version="$RELEASE_VERSION" \
            --config.publish.channel="${{ matrix.artifact }}" \
            --config.artifactName='Simpld-${{ matrix.artifact }}.${ext}'

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.yml
            release/*.blockmap
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Simpld 0.1.${{ github.run_number }}
          make_latest: true
          files: release/*
